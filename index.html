<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Casino Mockup</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand-switch">
          <button class="switch-chip is-active">Cassino</button>
          <button class="switch-chip">Esportes</button>
        </div>

        <div class="sidebar-promos" id="sidebar-promos"></div>

        <nav class="sidebar-nav" id="sidebar-nav"></nav>

        <div class="sidebar-bottom" id="sidebar-bottom"></div>
      </aside>

      <div class="content-area">
        <header class="topbar">
          <div class="topbar-brand">
            <button class="menu-button" id="mobile-menu-button" aria-label="Abrir menu">
              <span></span>
              <span></span>
              <span></span>
            </button>
            <div class="brand-mark">
              <span class="brand-diamond"></span>
              <strong>CASSINO</strong>
            </div>
          </div>

          <div class="topbar-actions">
            <label class="search-field">
              <span class="search-icon">⌕</span>
              <input
                id="search-input"
                type="search"
                placeholder="Buscar jogos, provedores, tags..."
              />
            </label>
            <div class="session-actions" id="session-actions"></div>
          </div>
        </header>

        <main class="page">
          <section class="page-view is-active" id="view-home">
            <div class="ticker-row" id="ticker-row"></div>
            <div class="jackpot-grid" id="jackpot-grid"></div>
            <div class="promo-hero-row" id="promo-hero-row"></div>
            <section class="shelf-section">
              <div class="section-header">
                <h2>Mais jogados da semana</h2>
                <button class="outline-button compact">Ver todos</button>
              </div>
              <div class="shelf-carousel">
                <button class="shelf-nav" data-shelf-nav="prev" data-shelf-key="popular" aria-label="Anterior">‹</button>
                <div class="game-row" id="popular-row" data-shelf-key="popular"></div>
                <button class="shelf-nav" data-shelf-nav="next" data-shelf-key="popular" aria-label="Próximo">›</button>
              </div>
            </section>
            <section class="shelf-section">
              <div class="section-header">
                <h2>Jogos Crash</h2>
                <button class="outline-button compact">Ver todos</button>
              </div>
              <div class="shelf-carousel">
                <button class="shelf-nav" data-shelf-nav="prev" data-shelf-key="crash" aria-label="Anterior">‹</button>
                <div class="game-row" id="crash-row" data-shelf-key="crash"></div>
                <button class="shelf-nav" data-shelf-nav="next" data-shelf-key="crash" aria-label="Próximo">›</button>
              </div>
            </section>
            <section class="shelf-section">
              <div class="section-header">
                <h2>Jogos de Slots</h2>
                <button class="outline-button compact">Ver todos</button>
              </div>
              <div class="shelf-carousel">
                <button class="shelf-nav" data-shelf-nav="prev" data-shelf-key="slots" aria-label="Anterior">‹</button>
                <div class="game-row" id="slots-row" data-shelf-key="slots"></div>
                <button class="shelf-nav" data-shelf-nav="next" data-shelf-key="slots" aria-label="Próximo">›</button>
              </div>
            </section>
          </section>

          <section class="page-view" id="view-detail">
            <button class="back-link" id="back-button">← Voltar</button>

            <section class="detail-hero" id="detail-hero">
              <div class="detail-hero-overlay">
                <div class="detail-game-stage" id="detail-game-stage"></div>
                <article class="detail-modal-card" id="detail-modal-card"></article>
              </div>
            </section>

            <section class="detail-title-bar" id="detail-title-bar"></section>

            <section class="detail-stats">
              <div class="section-header">
                <h2>Estatísticas</h2>
                <div class="pill-tabs">
                  <button class="pill-tab">Hoje</button>
                  <button class="pill-tab">7D</button>
                  <button class="pill-tab">15D</button>
                  <button class="pill-tab is-active">30D</button>
                </div>
              </div>
              <div class="stats-grid" id="stats-grid"></div>
            </section>

            <section class="detail-wins">
              <div class="section-header">
                <h2>Grande vitória</h2>
                <div class="pill-tabs">
                  <button class="pill-tab">Hoje</button>
                  <button class="pill-tab">3 dias</button>
                  <button class="pill-tab is-active">7 dias</button>
                </div>
              </div>
              <div class="wins-grid" id="wins-grid"></div>
            </section>

            <section class="shelf-section">
              <div class="section-header">
                <h2 id="related-title">Mais jogos</h2>
                <button class="outline-button compact">Ver todos</button>
              </div>
              <div class="shelf-carousel">
                <button class="shelf-nav" data-shelf-nav="prev" data-shelf-key="related" aria-label="Anterior">‹</button>
                <div class="game-row" id="related-row" data-shelf-key="related"></div>
                <button class="shelf-nav" data-shelf-nav="next" data-shelf-key="related" aria-label="Próximo">›</button>
              </div>
            </section>
          </section>
        </main>
      </div>
    </div>

    <div class="modal-backdrop hidden" id="login-modal">
      <div class="auth-card login-card">
        <div class="auth-header">
          <div>
            <p class="eyebrow">Acesso Demo</p>
            <h3>Entrar</h3>
          </div>
          <button class="icon-button" id="close-login-button">✕</button>
        </div>

        <form id="login-form" class="auth-form">
          <div class="login-tip">
            <strong>Use as credenciais fictícias do mock</strong>
            <span id="login-credentials-hint"></span>
          </div>
          <label>
            <span>E-mail</span>
            <input
              type="email"
              name="email"
              id="login-email"
              placeholder="demo@pulsebet.com"
              required
            />
          </label>
          <label>
            <span>Senha</span>
            <input
              type="password"
              name="password"
              id="login-password"
              placeholder="demo123"
              required
            />
          </label>
          <button type="submit" class="primary-button" id="login-submit">Entrar no demo</button>
        </form>
      </div>
    </div>

    <div class="modal-backdrop hidden" id="play-modal">
      <div class="auth-card play-card">
        <div class="auth-header">
          <div>
            <p class="eyebrow">Modo Demo</p>
            <h3 id="play-title">Definir aposta</h3>
          </div>
          <button class="icon-button" id="close-play-button">✕</button>
        </div>

        <form id="play-form" class="auth-form">
          <div class="play-game-summary">
            <strong id="play-game-name"></strong>
            <span id="play-game-meta"></span>
          </div>
          <div class="mini-stat-block">
            <small>Saldo disponível</small>
            <strong id="play-balance"></strong>
          </div>
          <label>
            <span>Quanto deseja colocar no jogo?</span>
            <input
              type="number"
              name="amount"
              id="play-amount"
              min="1"
              step="0.01"
              placeholder="10,00"
              required
            />
          </label>
          <div class="quick-amounts">
            <button type="button" class="outline-button compact" data-quick-amount="10">R$ 10</button>
            <button type="button" class="outline-button compact" data-quick-amount="25">R$ 25</button>
            <button type="button" class="outline-button compact" data-quick-amount="50">R$ 50</button>
            <button type="button" class="outline-button compact" data-quick-amount="100">R$ 100</button>
          </div>
          <button type="submit" class="primary-button" id="play-submit">Jogar agora</button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
